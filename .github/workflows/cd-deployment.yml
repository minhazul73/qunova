name: CD (deployment)

on:
  push:
    branches:
      - deployment
  workflow_dispatch:

jobs:
  build-android-apk:
    name: Build Android APKs (split per ABI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.41.2"
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename APK outputs to qunova
        shell: bash
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          for apk in app-*-release.apk; do
            [ -f "$apk" ] || continue
            new="${apk/#app-/qunova-}"
            mv "$apk" "$new"
            sha1sum "$new" | awk '{print $1}' > "$new.sha1"
          done

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/*-release.apk artifacts/ || true
          cp build/app/outputs/flutter-apk/*-release.apk.sha1 artifacts/ || true
          ls -la artifacts

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qunova-android-apks
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
